<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Group rotated to align with the jump trajectory -->
  <g transform="translate(10, 80) rotate(-25)">
    <!-- Antennae (Trailing backward due to wind) -->
    <path d="M 30,10 Q 15,3 0,5" fill="none" stroke="#39ff14" stroke-width="1.2" stroke-linecap="round" filter="url(#glow)" />
    <path d="M 32,13 Q 18,8 3,11" fill="none" stroke="#39ff14" stroke-width="1" stroke-linecap="round" filter="url(#glow)" />

    <!-- Forelegs (Tucked in) -->
    <path d="M 40,25 L 30,30 L 35,38" fill="none" stroke="#39ff14" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 45,26 L 38,32 L 40,40" fill="none" stroke="#39ff14" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.7" />

    <!-- Abdomen -->
    <path d="M 55,20 C 70,20 95,28 105,38 C 90,38 70,30 55,25 Z" fill="#1b1c1b" stroke="#39ff14" stroke-width="1" />
    
    <!-- Thorax -->
    <polygon points="35,12 55,10 60,25 38,25" fill="#242424" stroke="#39ff14" stroke-width="1.2" />

    <!-- Head -->
    <polygon points="35,12 22,20 28,30 38,25" fill="#1b1c1b" stroke="#39ff14" stroke-width="1.2" />
    <!-- Glowing Visor -->
    <polygon points="23,21 27,24 25,28 22,25" fill="#39ff14" filter="url(#glow)" />

    <!-- Wings (Slightly separating from body in leap) -->
    <path d="M 45,13 Q 80,10 98,28 Q 75,25 55,20" fill="rgba(57, 255, 20, 0.15)" stroke="#39ff14" stroke-width="1" filter="url(#glow)" />
    <line x1="55" y1="17" x2="85" y2="20" stroke="#39ff14" stroke-width="0.6" stroke-dasharray="2,2" />

    <!-- Extended Cyber Hind Legs -->
    <!-- Leg 1 (Foreground) -->
    <!-- Thigh (extended backwards) -->
    <path d="M 55,20 L 80,45 C 78,48 70,42 55,25 Z" fill="#242424" stroke="#39ff14" stroke-width="1.2" />
    <!-- Shin (fully extended) -->
    <path d="M 80,45 L 110,65 L 115,63" fill="none" stroke="#39ff14" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

    <!-- Leg 2 (Background) -->
    <!-- Thigh (extended backwards) -->
    <path d="M 52,20 L 75,48 Q 65,40 52,23 Z" fill="#111" stroke="#39ff14" stroke-width="1" opacity="0.6" />
    <!-- Shin (fully extended) -->
    <path d="M 75,48 L 102,70 L 107,68" fill="none" stroke="#39ff14" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />
  </g>
</svg>
