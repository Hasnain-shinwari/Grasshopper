<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <filter id="hero-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="neon-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff66" />
      <stop offset="100%" stop-color="#39ff14" />
    </linearGradient>
    <linearGradient id="dark-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d302e" />
      <stop offset="50%" stop-color="#1b1c1b" />
      <stop offset="100%" stop-color="#0c0d0c" />
    </linearGradient>
    <linearGradient id="gold-circ" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39ff14" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00ff66" stop-opacity="0.2" />
    </linearGradient>
    <!-- Circuit Grid Pattern for internal parts -->
    <pattern id="hero-circuits" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 10,0 L 10,20 L 20,30 L 40,30" fill="none" stroke="#39ff14" stroke-width="0.7" stroke-opacity="0.3" />
      <circle cx="20" cy="30" r="2" fill="#39ff14" fill-opacity="0.4" />
      <circle cx="10" cy="10" r="1.5" fill="#39ff14" fill-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Glowing Grid Backdrop behind the hero grasshopper -->
  <g opacity="0.15">
    <line x1="50" y1="50" x2="550" y2="50" stroke="#39ff14" stroke-width="0.5" />
    <line x1="50" y1="150" x2="550" y2="150" stroke="#39ff14" stroke-width="0.5" />
    <line x1="50" y1="250" x2="550" y2="250" stroke="#39ff14" stroke-width="0.5" />
    <line x1="50" y1="350" x2="550" y2="350" stroke="#39ff14" stroke-width="0.5" />
    <line x1="100" y1="20" x2="100" y2="380" stroke="#39ff14" stroke-width="0.5" />
    <line x1="250" y1="20" x2="250" y2="380" stroke="#39ff14" stroke-width="0.5" />
    <line x1="400" y1="20" x2="400" y2="380" stroke="#39ff14" stroke-width="0.5" />
    <!-- Cyber Node connections -->
    <circle cx="250" cy="150" r="3" fill="#39ff14" filter="url(#hero-glow)" />
    <circle cx="400" cy="250" r="3" fill="#39ff14" filter="url(#hero-glow)" />
    <circle cx="100" cy="250" r="3" fill="#39ff14" filter="url(#hero-glow)" />
    <path d="M 100,250 L 250,150 L 400,250" fill="none" stroke="#39ff14" stroke-width="1" stroke-dasharray="4,4" />
  </g>

  <!-- Cybernetic Grasshopper Side Profile -->
  <g transform="translate(60, 40)">
    
    <!-- Wing Panel 2 (Behind) -->
    <path d="M 220,130 Q 380,80 430,220 Q 320,200 240,160 Z" fill="url(#gold-circ)" fill-opacity="0.1" stroke="#39ff14" stroke-width="0.8" stroke-dasharray="3,3" />

    <!-- Abdomen Section -->
    <g id="hero-abdomen">
      <path d="M 220,160 C 260,160 380,180 410,230 C 420,245 400,265 370,250 C 330,230 250,200 220,190 Z" fill="url(#dark-metal)" stroke="#39ff14" stroke-width="1.2" />
      <!-- Cyber Segments -->
      <path d="M 255,168 L 245,193" stroke="#39ff14" stroke-width="1.5" filter="url(#hero-glow)" />
      <path d="M 285,174 L 275,202" stroke="#39ff14" stroke-width="1.5" filter="url(#hero-glow)" />
      <path d="M 315,182 L 305,212" stroke="#39ff14" stroke-width="1.5" filter="url(#hero-glow)" />
      <path d="M 345,192 L 335,225" stroke="#39ff14" stroke-width="1.5" filter="url(#hero-glow)" />
      <path d="M 375,205 L 362,238" stroke="#39ff14" stroke-width="1.5" filter="url(#hero-glow)" />
      <!-- Circuit-board patterns overlaid -->
      <path d="M 230,175 H 350" stroke="#39ff14" stroke-width="0.8" stroke-opacity="0.3" />
      <path d="M 260,185 H 320" stroke="#39ff14" stroke-width="0.8" stroke-opacity="0.3" />
    </g>

    <!-- Main Thorax / Chassis -->
    <path d="M 120,130 L 220,120 L 240,195 L 140,205 Z" fill="url(#dark-metal)" stroke="url(#neon-green)" stroke-width="2" />
    <!-- Embedded Circuit-board window -->
    <path d="M 145,145 L 205,138 L 215,180 L 155,188 Z" fill="#121613" stroke="#39ff14" stroke-width="1" />
    <path d="M 145,145 L 205,138 L 215,180 L 155,188 Z" fill="url(#hero-circuits)" />
    <!-- Hex pattern decal -->
    <polygon points="175,150 190,150 198,162 190,175 175,175 168,162" fill="url(#neon-green)" fill-opacity="0.2" stroke="#39ff14" stroke-width="0.5" />

    <!-- Head / Computer Console Module -->
    <polygon points="120,130 65,155 60,200 100,220 135,200" fill="url(#dark-metal)" stroke="url(#neon-green)" stroke-width="2" />
    <!-- Robotic Visor Eye -->
    <polygon points="63,165 95,152 105,175 62,188" fill="#080808" stroke="#39ff14" stroke-width="1" />
    <polygon points="66,170 91,158 97,173 66,183" fill="#39ff14" filter="url(#hero-glow)" />
    <line x1="72" y1="172" x2="88" y2="164" stroke="#ffffff" stroke-width="0.8" />
    <!-- Scanner line -->
    <line x1="66" y1="178" x2="96" y2="178" stroke="#ffffff" stroke-width="1.2" opacity="0.8" />

    <!-- Antennae / Fiber Optic Sensers -->
    <path d="M 85,140 Q 60,60 10,40" fill="none" stroke="url(#neon-green)" stroke-width="2.5" stroke-linecap="round" filter="url(#hero-glow)" />
    <path d="M 95,136 Q 85,75 55,45" fill="none" stroke="url(#neon-green)" stroke-width="1.8" stroke-linecap="round" filter="url(#hero-glow)" />
    <circle cx="10" cy="40" r="3" fill="#ffffff" filter="url(#hero-glow)" />
    <circle cx="55" cy="45" r="2" fill="#ffffff" filter="url(#hero-glow)" />

    <!-- Glowing Cyber Wings (Foreground) -->
    <g id="hero-wings">
      <path d="M 180,125 Q 380,50 480,140 Q 360,170 200,150 Z" fill="url(#neon-green)" fill-opacity="0.15" stroke="url(#neon-green)" stroke-width="1.5" filter="url(#hero-glow)" />
      <!-- Wing veins/circuit lines -->
      <path d="M 210,143 Q 340,90 440,115" fill="none" stroke="#39ff14" stroke-width="1" />
      <path d="M 240,145 Q 320,110 400,135" fill="none" stroke="#39ff14" stroke-width="1" stroke-dasharray="2,2" />
      <path d="M 270,146 Q 340,130 380,145" fill="none" stroke="#39ff14" stroke-width="1" />
      <path d="M 320,110 L 335,133" stroke="#39ff14" stroke-width="0.8" />
      <path d="M 360,103 L 375,123" stroke="#39ff14" stroke-width="0.8" />
    </g>

    <!-- Mechanical Legs (Forelegs & Midlegs) -->
    <!-- Foreleg (left) -->
    <path d="M 120,200 L 90,240 L 70,280 L 85,285" fill="none" stroke="url(#neon-green)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="90" cy="240" r="4" fill="#1e1e1e" stroke="#39ff14" stroke-width="1.5" />
    <!-- Foreleg (right) -->
    <path d="M 100,210 L 80,250 L 55,290 L 70,295" fill="none" stroke="url(#neon-green)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7" />

    <!-- Midleg (left) -->
    <path d="M 160,200 L 140,260 L 105,310 L 125,315" fill="none" stroke="url(#neon-green)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="140" cy="260" r="4" fill="#1e1e1e" stroke="#39ff14" stroke-width="1.5" />
    <!-- Midleg (right) -->
    <path d="M 145,200 L 125,260 L 95,310 L 110,315" fill="none" stroke="url(#neon-green)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7" />

    <!-- Giant Cyber Jumping Hindleg -->
    <!-- Joint Mount -->
    <circle cx="220" cy="185" r="14" fill="#161816" stroke="#39ff14" stroke-width="2" />
    <circle cx="220" cy="185" r="6" fill="#39ff14" filter="url(#hero-glow)" />

    <!-- Femur (Thick futuristic thigh plate) -->
    <path d="M 220,185 L 140,290 C 135,298 140,312 155,305 L 242,205 Z" fill="url(#dark-metal)" stroke="url(#neon-green)" stroke-width="2.5" />
    <path d="M 210,195 L 155,275 M 205,215 L 170,265" stroke="#39ff14" stroke-width="1.2" stroke-dasharray="3,3" />
    
    <!-- Main Joint Bolt -->
    <circle cx="148" cy="298" r="8" fill="#121212" stroke="#39ff14" stroke-width="1.5" />
    <circle cx="148" cy="298" r="3" fill="#39ff14" filter="url(#hero-glow)" />

    <!-- Tibia (Lower leg rod with spring/piston system) -->
    <path d="M 148,298 L 220,375" fill="none" stroke="url(#neon-green)" stroke-width="3" stroke-linecap="round" />
    <!-- Piston structure overlay -->
    <line x1="165" y1="285" x2="190" y2="340" stroke="#ffffff" stroke-width="1.5" filter="url(#hero-glow)" />
    <!-- Tarsus/Claw -->
    <path d="M 220,375 L 245,380 L 235,372" fill="none" stroke="url(#neon-green)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Shadow/Glow under grasshopper -->
    <ellipse cx="200" cy="390" rx="150" ry="8" fill="#39ff14" fill-opacity="0.08" filter="url(#hero-glow)" />
  </g>
</svg>
