<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(50, 50)">
    <!-- Antennae -->
    <path d="M -5,-35 Q -10,-48 -25,-55" fill="none" stroke="#39ff14" stroke-width="1" stroke-linecap="round" filter="url(#glow)" />
    <path d="M 5,-35 Q 10,-48 25,-55" fill="none" stroke="#39ff14" stroke-width="1" stroke-linecap="round" filter="url(#glow)" />

    <!-- Hind Legs (Streamlined backwards during flight) -->
    <path d="M -12,15 L -22,35 L -18,50" fill="none" stroke="#39ff14" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />
    <path d="M 12,15 L 22,35 L 18,50" fill="none" stroke="#39ff14" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />

    <!-- Body / Abdomen (Segmented) -->
    <rect x="-8" y="-25" width="16" height="50" rx="6" fill="#1e1e1e" stroke="#39ff14" stroke-width="1.5" />
    <!-- Segment lines -->
    <line x1="-7" y1="-10" x2="7" y2="-10" stroke="#39ff14" stroke-width="0.8" />
    <line x1="-7" y1="0" x2="7" y2="0" stroke="#39ff14" stroke-width="0.8" />
    <line x1="-7" y1="10" x2="7" y2="10" stroke="#39ff14" stroke-width="0.8" />
    <line x1="-6" y1="20" x2="6" y2="20" stroke="#39ff14" stroke-width="0.8" />

    <!-- Head -->
    <polygon points="0,-35 -8,-25 8,-25" fill="#2a2a2a" stroke="#39ff14" stroke-width="1" />
    <!-- Cyber Eyes -->
    <circle cx="-5" cy="-28" r="1.5" fill="#39ff14" filter="url(#glow)" />
    <circle cx="5" cy="-28" r="1.5" fill="#39ff14" filter="url(#glow)" />

    <!-- Left Wing (Designed for CSS scaling/rotation from origin 0,0) -->
    <g class="wing-left" style="transform-origin: -6px -15px;">
      <path d="M -6,-15 C -25,-40 -48,-30 -45,-5 C -42,20 -15,5 -6,-15" fill="rgba(57, 255, 20, 0.18)" stroke="#39ff14" stroke-width="1" filter="url(#glow)" />
      <!-- Wing circuits -->
      <path d="M -6,-15 Q -25,-20 -35,-12" fill="none" stroke="#39ff14" stroke-width="0.5" opacity="0.6" />
    </g>

    <!-- Right Wing -->
    <g class="wing-right" style="transform-origin: 6px -15px;">
      <path d="M 6,-15 C 25,-40 48,-30 45,-5 C 42,20 15,5 6,-15" fill="rgba(57, 255, 20, 0.18)" stroke="#39ff14" stroke-width="1" filter="url(#glow)" />
      <!-- Wing circuits -->
      <path d="M 6,-15 Q 25,-20 35,-12" fill="none" stroke="#39ff14" stroke-width="0.5" opacity="0.6" />
    </g>
  </g>
</svg>
