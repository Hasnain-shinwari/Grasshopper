<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Core Green Glow -->
    <filter id="cyber-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Linear Gradients -->
    <linearGradient id="neon-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff66" />
      <stop offset="100%" stop-color="#39ff14" />
    </linearGradient>
    <linearGradient id="cyber-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2a" />
      <stop offset="100%" stop-color="#111111" />
    </linearGradient>

    <!-- Circuit Pattern -->
    <pattern id="circuits" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0,5 h10 M5,0 v10" stroke="#00ff66" stroke-width="0.3" stroke-opacity="0.15" />
      <circle cx="5" cy="5" r="1" fill="#39ff14" fill-opacity="0.2" />
    </pattern>
  </defs>

  <!-- Background Shield (Invisible/Semi-transparent dark hex or shield) -->
  <polygon points="50,5 92,25 92,75 50,95 8,75 8,25" fill="#0c0f0a" stroke="url(#neon-green)" stroke-width="1.5" stroke-opacity="0.6" filter="url(#cyber-glow)" />
  <polygon points="50,10 87,28 87,72 50,90 13,72 13,28" fill="url(#cyber-dark)" stroke="#39ff14" stroke-width="0.5" stroke-opacity="0.3" />

  <!-- Circuit Trace Background inside Shield -->
  <polygon points="50,10 87,28 87,72 50,90 13,72 13,28" fill="url(#circuits)" />

  <!-- Logo Group -->
  <g transform="translate(10, 10) scale(0.8)">
    <!-- Antennae -->
    <path d="M 40,25 Q 35,5 20,2" fill="none" stroke="url(#neon-green)" stroke-width="1.5" stroke-linecap="round" filter="url(#cyber-glow)" />
    <path d="M 60,25 Q 65,5 80,2" fill="none" stroke="url(#neon-green)" stroke-width="1.5" stroke-linecap="round" filter="url(#cyber-glow)" />
    <!-- Antenna nodes -->
    <circle cx="20" cy="2" r="1.5" fill="#39ff14" filter="url(#cyber-glow)" />
    <circle cx="80" cy="2" r="1.5" fill="#39ff14" filter="url(#cyber-glow)" />

    <!-- Compound Cyber Eyes -->
    <polygon points="38,28 45,30 43,38 35,35" fill="url(#neon-green)" filter="url(#cyber-glow)" />
    <polygon points="62,28 55,30 57,38 65,35" fill="url(#neon-green)" filter="url(#cyber-glow)" />

    <!-- Cyber Head -->
    <polygon points="50,18 42,26 42,34 50,42 58,34 58,26" fill="#1e1e1e" stroke="url(#neon-green)" stroke-width="1.5" />
    
    <!-- Thorax (Circuit-style plates) -->
    <path d="M 40,44 L 60,44 L 64,56 L 36,56 Z" fill="#242424" stroke="url(#neon-green)" stroke-width="1.5" />
    <line x1="50" y1="44" x2="50" y2="56" stroke="url(#neon-green)" stroke-width="1" />
    
    <!-- Abdomen -->
    <path d="M 38,58 L 62,58 L 58,82 L 50,92 L 42,82 Z" fill="#1e1e1e" stroke="url(#neon-green)" stroke-width="1.2" />
    <!-- Segments -->
    <line x1="40" y1="64" x2="60" y2="64" stroke="url(#neon-green)" stroke-width="0.8" stroke-dasharray="2,2" />
    <line x1="42" y1="70" x2="58" y2="70" stroke="url(#neon-green)" stroke-width="0.8" stroke-dasharray="2,2" />
    <line x1="44" y1="76" x2="56" y2="76" stroke="url(#neon-green)" stroke-width="0.8" stroke-dasharray="2,2" />
    <line x1="46" y1="82" x2="54" y2="82" stroke="url(#neon-green)" stroke-width="0.8" stroke-dasharray="2,2" />
    
    <!-- Cyber Wings (Semi-transparent overlaying lines) -->
    <path d="M 41,50 Q 25,60 22,80 Q 35,75 42,56" fill="url(#neon-green)" fill-opacity="0.15" stroke="url(#neon-green)" stroke-width="1" />
    <path d="M 59,50 Q 75,60 78,80 Q 65,75 58,56" fill="url(#neon-green)" fill-opacity="0.15" stroke="url(#neon-green)" stroke-width="1" />
    
    <!-- Mechanical Forelegs -->
    <path d="M 36,46 L 25,48 L 18,38" fill="none" stroke="url(#neon-green)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 64,46 L 75,48 L 82,38" fill="none" stroke="url(#neon-green)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Mechanical Midlegs -->
    <path d="M 37,52 L 20,56 L 12,68" fill="none" stroke="url(#neon-green)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 63,52 L 80,56 L 88,68" fill="none" stroke="url(#neon-green)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Powerful Cyber Hindlegs -->
    <!-- Femur (thick plate) -->
    <path d="M 38,58 L 22,70 L 16,85 L 26,82 L 38,62 Z" fill="#242424" stroke="url(#neon-green)" stroke-width="1.2" />
    <!-- Tibia/Tarsus (thin angular bar) -->
    <path d="M 16,85 L 10,95 L 18,98" fill="none" stroke="url(#neon-green)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

    <path d="M 62,58 L 78,70 L 84,85 L 74,82 L 62,62 Z" fill="#242424" stroke="url(#neon-green)" stroke-width="1.2" />
    <path d="M 84,85 L 90,95 L 82,98" fill="none" stroke="url(#neon-green)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
